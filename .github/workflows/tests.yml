name: tests

on:
  pull_request:
  push:
    branches: [ main, develop ]

jobs:
  unit:
    name: Unit tests (Linux, Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev libegl1 libxkbcommon0
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        run: |
          python -m pytest -q -m unit

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest==8.3.2
      # --noconftest: the guards parse the source tree and use no fixture, so
      # they run without the app's dependencies. The shared conftest patches a
      # symbol inside `jarvis`, which would drag the whole runtime in.
      - name: Import isolation, single writer, no local LLM runtime
        run: |
          python -m pytest -q -p no:cacheprovider --noconftest \
            tests/test_import_isolation.py \
            tests/test_single_writer.py \
            tests/test_no_local_llm_strings.py

