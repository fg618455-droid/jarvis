<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Jarvis</title>
    <!-- Everything is served from this machine. No fonts, scripts, or styles
         are fetched from anywhere else. -->
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/deck.css" />
    <link rel="stylesheet" href="/static/css/views.css" />
    <!-- The theme is applied before the first paint rather than by the module
         below, which is deferred: a page that painted graphite and then
         repainted ember would flash on every load for anyone who changed it.
         The attribute above is the fallback for a browser that never runs
         this, so the interface is never left with no palette at all.

         The list of names is a copy of `THEMES` in `theme.js`, because this
         script runs before any module can be imported. `test_theme_tokens.py`
         holds the two in step. -->
    <script>
      try {
        var stored = localStorage.getItem("jarvis.theme");
        if (stored === "graphite" || stored === "arc" || stored === "ember") {
          document.documentElement.dataset.theme = stored;
        }
      } catch (error) {
        /* Site data is disabled; the default in the attribute stands. */
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%237dd3fc'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Three kinds of thing, and they are grouped as three rather than run
         together into one strip: what the assistant is doing right now, two
         readings about it, and the controls that change this page. -->
    <header class="header">
      <div class="header-group header-live">
        <span class="brand">
          <span class="dot" id="phase-dot" data-phase="starting"></span>
          <span id="brand-name">Jarvis</span>
        </span>
        <span id="phase-text" class="muted"></span>
        <span id="passive-indicator" class="passive-indicator" hidden>
          <span class="passive-dot"></span>
          <span id="passive-text"></span>
        </span>
        <span id="conversation-indicator" class="conversation-indicator" hidden>
          <span class="conversation-dot"></span>
          <span id="conversation-indicator-text"></span>
        </span>
      </div>
      <div class="header-group header-readings">
        <span class="header-metric">
          <span class="label" id="uptime-label"></span>
          <span class="num" id="uptime-value">—</span>
        </span>
        <span class="header-metric">
          <span class="label" id="last-turn-label"></span>
          <span class="num" id="last-turn-value">—</span>
        </span>
      </div>
      <div class="header-group header-controls">
        <select id="theme" aria-label="Theme"></select>
        <select id="language" aria-label="Language"></select>
        <button
          type="button"
          class="settings-button"
          id="settings-button"
          aria-label="Settings"
        ></button>
      </div>
    </header>

    <main class="main"><div id="view-root"></div></main>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
