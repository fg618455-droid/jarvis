<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Jarvis</title>
    <!-- Everything is served from this machine. No fonts, scripts, or styles
         are fetched from anywhere else. -->
    <link rel="stylesheet" href="/static/css/tokens.css" />
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="stylesheet" href="/static/css/views.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%237dd3fc'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="dot" id="phase-dot" data-phase="starting"></span>
        <span id="brand-name">Jarvis</span>
      </div>
      <div class="header-right">
        <span id="phase-text" class="muted"></span>
        <span id="passive-indicator" class="passive-indicator" hidden>
          <span class="passive-dot"></span>
          <span id="passive-text"></span>
        </span>
        <span id="conversation-indicator" class="conversation-indicator" hidden>
          <span class="conversation-dot"></span>
          <span id="conversation-indicator-text"></span>
        </span>
        <span class="header-metric">
          <span class="label" id="uptime-label"></span>
          <span class="num" id="uptime-value">—</span>
        </span>
        <span class="header-metric">
          <span class="label" id="last-turn-label"></span>
          <span class="num" id="last-turn-value">—</span>
        </span>
        <select id="language" aria-label="Language" style="width: auto"></select>
      </div>
    </header>

    <nav class="sidebar" id="sidebar"></nav>

    <main class="main"><div id="view-root"></div></main>

    <script type="module" src="/static/js/app.js"></script>
  </body>
</html>
